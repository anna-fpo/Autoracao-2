<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Editar Usuário</title>
</head>
<body>
  <h2>Editar Usuário</h2>

  <label for="id">ID do usuário:</label><br />
  <input type="text" id="id" />
  <button onclick="buscarUsuario()">Buscar</button><br /><br />

  <label for="nome">Nome:</label><br />
  <input type="text" id="nome" disabled /><br /><br />

  <label for="idade">Idade:</label><br />
  <input type="number" id="idade" disabled /><br /><br />

  <label for="endereco">Endereço:</label><br />
  <input type="text" id="endereco" disabled /><br /><br />

  <label for="email">Email:</label><br />
  <input type="email" id="email" disabled /><br /><br />

  <button id="btnSalvar" onclick="editarUsuario()" disabled>Salvar alterações</button>

  <p id="resposta"></p>

  <script>
    function buscarUsuario() {
      const id = document.getElementById("id").value;

      fetch("/list-users")
        .then(response => response.json())
        .then(usuarios => {
          const usuario = usuarios.find(u => u.id === id);
          if (!usuario) {
            document.getElementById("resposta").innerText = "Usuário não encontrado.";
            return;
          }

          document.getElementById("nome").value = usuario.nome;
          document.getElementById("idade").value = usuario.idade;
          document.getElementById("endereco").value = usuario.endereco;
          document.getElementById("email").value = usuario.email;

          // Ativa campos e botão
          document.getElementById("nome").disabled = false;
          document.getElementById("idade").disabled = false;
          document.getElementById("endereco").disabled = false;
          document.getElementById("email").disabled = false;
          document.getElementById("btnSalvar").disabled = false;

          document.getElementById("resposta").innerText = "";
        })
        .catch(() => {
          document.getElementById("resposta").innerText = "Erro ao buscar usuário.";
        });
    }

    function editarUsuario() {
      const id = document.getElementById("id").value;
      const dados = {
        nome: document.getElementById("nome").value,
        idade: document.getElementById("idade").value,
        endereco: document.getElementById("endereco").value,
        email: document.getElementById("email").value,
      };

      fetch(`/usuarios/${id}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(dados)
      })
        .then(response => response.json())
        .then(data => {
          if (data.erro) {
            document.getElementById("resposta").innerText = "Erro: " + data.erro;
          } else {
            document.getElementById("resposta").innerText = "Usuário atualizado com sucesso!";
          }
        })
        .catch(() => {
          document.getElementById("resposta").innerText = "Erro ao salvar alterações.";
        });
    }
  </script>
</body>
</html>
