<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Remover Usuário</title>
</head>
<body>
  <h2>Remover Usuário</h2>

  <label for="id">ID do usuário:</label><br />
  <input type="text" id="id" placeholder="Cole o ID aqui" /><br /><br />

  <button onclick="removerUsuario()">Remover</button>

  <p id="resposta"></p>

  <script>
    function removerUsuario() {
      const id = document.getElementById("id").value;

      if (!id) {
        document.getElementById("resposta").innerText = "Digite um ID válido.";
        return;
      }

      fetch(`/usuarios/${id}`, {
        method: "DELETE"
      })
        .then(res => res.json())
        .then(data => {
          if (data.erro) {
            document.getElementById("resposta").innerText = "Erro: " + data.erro;
          } else {
            document.getElementById("resposta").innerText = "Usuário removido com sucesso!";
          }
        })
        .catch(() => {
          document.getElementById("resposta").innerText = "Erro ao remover usuário.";
        });
    }
  </script>
</body>
</html>
